<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学生会 · 通知公告</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #F7F6F3;
  --surface: #FFFFFF;
  --text: #1a1a1a;
  --text-sub: #8a8a8a;
  --text-muted: #b0b0b0;
  --accent: #2563EB;
  --accent-hover: #1d4ed8;
  --accent-light: #EFF6FF;
  --border: #EAEAEA;
  --radius: 10px;
  --radius-sm: 6px;
  --max-w: 880px;
  --font: 'SF Pro Display', 'Geist Sans', -apple-system, 'Helvetica Neue', 'PingFang SC', 'Noto Sans SC', sans-serif;
  --font-mono: 'Geist Mono', 'SF Mono', 'JetBrains Mono', monospace;
  --transition: cubic-bezier(0.16, 1, 0.3, 1);
  --shadow: none;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  line-height: 1.6;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ===== Animations ===== */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.96) translateY(8px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
@keyframes toastIn {
  from { opacity: 0; transform: translateX(-50%) translateY(-12px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}
@keyframes sliderFadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes sliderModalIn {
  from { opacity: 0; transform: scale(0.92) translateY(16px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

/* ===== Login Screen ===== */
.login-screen {
  display: none;
  position: fixed; inset: 0; z-index: 100;
  background: var(--bg);
  align-items: center; justify-content: center;
}
.login-screen.show { display: flex; }

.login-box {
  background: var(--surface);
  border-radius: 12px;
  width: min(90vw, 400px);
  padding: 40px 32px 32px;
  border: 1px solid var(--border);
  animation: fadeUp 0.5s var(--transition);
}

.login-box h2 {
  text-align: center; font-size: 20px; font-weight: 600;
  margin-bottom: 4px; color: var(--text);
  letter-spacing: -0.01em;
}

.login-box .login-sub {
  text-align: center; font-size: 13px; color: var(--text-sub);
  margin-bottom: 28px;
}

.login-field { margin-bottom: 18px; }

.login-field label {
  display: block; font-size: 12px; font-weight: 500;
  color: var(--text-sub); margin-bottom: 6px;
  text-transform: uppercase; letter-spacing: 0.04em;
}

.login-field input {
  width: 100%; padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 14px; font-family: var(--font);
  outline: none; transition: border-color 0.2s;
  background: var(--surface);
  color: var(--text);
}
.login-field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.08); }

.login-error {
  color: #dc2626; font-size: 13px; text-align: center;
  margin-bottom: 12px; min-height: 20px;
}

.login-btn {
  width: 100%; padding: 11px; border: none;
  border-radius: var(--radius-sm);
  background: var(--accent); color: #fff;
  font-size: 14px; font-weight: 500; cursor: pointer;
  font-family: var(--font); transition: all 0.2s;
  letter-spacing: 0.02em;
}
.login-btn:hover { background: var(--accent-hover); }
.login-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ===== Main App ===== */
.main-app { display: none; }
.main-app.show { display: block; }

/* ===== Header ===== */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 32px 24px 28px;
  text-align: center;
}
.header h1 {
  font-size: 22px; font-weight: 600;
  letter-spacing: -0.02em; margin-bottom: 4px;
  color: var(--text);
}
.header p { font-size: 13px; color: var(--text-muted); }
.header .subtitle { font-size: 11px; color: var(--text-muted); margin-top: 6px; }

/* ===== Layout ===== */
.container { max-width: var(--max-w); margin: 0 auto; padding: 24px 20px 60px; }

/* ===== User Bar ===== */
.user-bar {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px;
  padding: 10px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 13px;
}

.user-bar-info {
  display: flex; align-items: center; gap: 6px;
  color: var(--text);
  font-weight: 500;
}

.user-bar-actions {
  display: flex; align-items: center; gap: 14px;
}

.user-bar-link {
  color: var(--text-sub); cursor: pointer;
  font-size: 12px; transition: color 0.15s;
  display: inline-flex; align-items: center; gap: 3px;
}
.user-bar-link:hover { color: var(--accent); }

/* ===== Action Bar ===== */
.action-bar {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 28px;
  flex-wrap: wrap;
}

.action-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 9px 20px;
  border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 500; cursor: pointer;
  font-family: var(--font);
  transition: all 0.2s;
  text-decoration: none;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--text);
}
.action-btn:hover { background: #f5f5f5; border-color: #d0d0d0; }
.action-btn:active { transform: scale(0.97); }

.action-btn-primary {
  background: var(--accent); color: #fff; border-color: var(--accent);
}
.action-btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

.action-btn-purple {
  border-color: #c084fc; color: #7c3aed;
}
.action-btn-purple:hover { background: #faf5ff; border-color: #a855f7; }

.action-btn-teal {
  border-color: #5eead4; color: #0f766e;
}
.action-btn-teal:hover { background: #f0fdfa; border-color: #14b8a6; }
/* ===== Section Headers ===== */
.section-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 16px; padding-top: 24px;
}
.section-header:first-of-type { padding-top: 0; }
.section-header h3 {
  font-size: 15px; font-weight: 600; color: var(--text);
  letter-spacing: -0.01em;
}
.section-header .section-line {
  flex: 1; height: 1px; background: var(--border); margin-left: 16px;
}
/* ===== Notice Card ===== */
.notice-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 14px;
  transition: all 0.2s var(--transition);
}
.notice-card:hover { border-color: #d0d0d0; }

.notice-card.pinned {
  border-left: 3px solid var(--accent);
}

.notice-card .notice-title {
  font-size: 16px; font-weight: 600; color: var(--text);
  margin-bottom: 8px; line-height: 1.4;
  letter-spacing: -0.01em;
}

.notice-card .notice-content {
  font-size: 14px; color: var(--text);
  line-height: 1.7;
  margin-bottom: 14px;
}
.notice-card .notice-content p { margin: 6px 0; }
.notice-card .notice-content ul, .notice-card .notice-content ol { padding-left: 20px; margin: 6px 0; }
.notice-card .notice-content li { margin: 2px 0; }
.notice-card .notice-content code {
  background: #f3f4f6; padding: 2px 6px; border-radius: 4px;
  font-size: 13px; font-family: var(--font-mono);
}
.notice-card .notice-content blockquote {
  margin: 8px 0; padding: 8px 14px; border-left: 3px solid var(--accent);
  background: rgba(0,0,0,0.02); border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  color: var(--text-sub);
}
.notice-card .notice-content a { color: var(--accent); }
.notice-card .notice-content img { max-width: 100%; border-radius: 8px; margin: 6px 0; }
.notice-card .notice-content hr { border: none; border-top: 1px solid var(--border); margin: 12px 0; }
.notice-card .notice-content h1,
.notice-card .notice-content h2,
.notice-card .notice-content h3 { margin: 12px 0 6px; font-weight: 600; color: var(--text); }

.notice-card .notice-meta {
  display: flex; gap: 16px; font-size: 12px; color: var(--text-muted);
  padding-top: 12px; border-top: 1px solid var(--border);
}

.empty-tip {
  text-align: center; padding: 60px 20px;
  color: var(--text-muted); font-size: 14px;
}

.loading {
  text-align: center; padding: 40px;
  color: var(--text-muted); font-size: 13px;
}

/* ===== Markdown Preview ===== */
.md-preview {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 14px 16px; font-size: 14px;
  line-height: 1.7; color: var(--text); min-height: 80px;
  white-space: normal;
}
.md-preview strong { font-weight: 600; }
.md-preview em { font-style: italic; }
.md-preview code { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; font-size: 13px; font-family: var(--font-mono); }
.md-preview a { color: var(--accent); }
.md-preview blockquote {
  margin: 10px 0; padding: 10px 14px; border-left: 3px solid var(--accent);
  background: rgba(0,0,0,0.02); border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  color: var(--text-sub);
}
.md-preview ul, .md-preview ol { padding-left: 20px; margin: 8px 0; }
.md-preview hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
.md-preview h1, .md-preview h2, .md-preview h3 { margin: 14px 0 8px; font-weight: 600; color: var(--text); }

/* ===== Modals ===== */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.3); z-index: 200;
  align-items: center; justify-content: center;
  padding: 20px;
}
.modal-overlay.show { display: flex; }

.modal-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  width: min(92vw, 520px); max-height: 90vh;
  animation: modalIn 0.3s var(--transition);
  display: flex; flex-direction: column;
  overflow: hidden;
}

.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 24px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.modal-header h3 { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
.modal-close {
  background: none; border: none; font-size: 20px; cursor: pointer;
  color: var(--text-muted); padding: 0; line-height: 1;
  width: 28px; height: 28px; display: flex; align-items: center;
  justify-content: center; border-radius: var(--radius-sm);
  transition: all 0.15s;
}
.modal-close:hover { background: #f5f5f5; color: var(--text); }

.modal-body { padding: 20px 24px; overflow-y: auto; flex: 1; min-height: 0; }

.form-group { margin-bottom: 18px; }
.form-group label {
  display: block; font-size: 12px; font-weight: 500;
  color: var(--text-sub); margin-bottom: 6px;
  letter-spacing: 0.02em;
}

.form-input {
  width: 100%; padding: 10px 14px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-size: 14px; font-family: var(--font);
  outline: none; transition: all 0.2s;
  background: var(--surface); color: var(--text);
}
.form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.08); }
.form-textarea { min-height: 120px; resize: vertical; }

.form-error { color: #dc2626; font-size: 13px; margin-top: 4px; }

.form-actions {
  display: flex; gap: 10px; justify-content: flex-end;
  padding: 14px 24px;
  border-top: 1px solid var(--border);
  background: var(--surface); flex-shrink: 0;
}

.btn-cancel {
  padding: 8px 18px; border: 1px solid var(--border);
  border-radius: var(--radius-sm); background: transparent;
  color: var(--text-sub); font-size: 13px; cursor: pointer;
  font-family: var(--font); transition: all 0.15s;
}
.btn-cancel:hover { background: #f5f5f5; }

.btn-submit {
  padding: 8px 20px; border: none;
  border-radius: var(--radius-sm); background: var(--accent);
  color: #fff; font-size: 13px; font-weight: 500; cursor: pointer;
  font-family: var(--font); transition: all 0.15s;
}
.btn-submit:hover { background: var(--accent-hover); }
.btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

/* ===== Toast ===== */
.toast {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
  padding: 10px 22px; border-radius: var(--radius-sm);
  color: #fff; font-size: 13px; font-weight: 500; z-index: 999;
  animation: toastIn 0.35s var(--transition);
  pointer-events: none;
  white-space: nowrap;
}
.toast.success { background: #059669; }
.toast.error { background: #dc2626; }
.toast.warning { background: #d97706; }

/* ===== Vote Card ===== */
.vote-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-bottom: 14px;
}
.vote-card-header {
  display: flex; justify-content: space-between;
  align-items: flex-start; margin-bottom: 14px; gap: 12px;
}
.vote-card-title {
  font-size: 15px; font-weight: 600;
  color: var(--text); line-height: 1.4;
  letter-spacing: -0.01em;
}
.vote-card-title a { color: inherit; text-decoration: none; }
.vote-card-title a:hover { color: #2563eb; }
.vote-card-meta {
  font-size: 12px; color: var(--text-muted);
  display: flex; gap: 12px; margin-top: 6px; flex-wrap: wrap;
}
.vote-card-options {
  display: flex; flex-direction: column; gap: 8px;
}
.vote-option {
  display: flex; align-items: center;
  padding: 10px 12px;
  background: #fafafa;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.15s;
  border: 1px solid transparent;
}
.vote-option:hover { background: #f0f0f0; border-color: var(--border); }
.vote-option.selected { background: var(--accent-light); border-color: var(--accent); }
.vote-option input[type="checkbox"],
.vote-option input[type="radio"] {
  margin-right: 10px; width: 16px; height: 16px;
}
.vote-option-text { flex: 1; font-size: 14px; color: var(--text); }
.vote-option-percent { font-size: 13px; color: var(--accent); font-weight: 500; }
.vote-option-bar {
  height: 4px; background: #f0f0f0;
  border-radius: 2px; overflow: hidden; margin-top: 6px;
}
.vote-option-bar-fill {
  height: 100%; background: var(--accent);
  border-radius: 2px; transition: width 0.5s var(--transition);
}
.vote-custom-option {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 0; border-top: 1px dashed var(--border); margin-top: 6px;
}
.vote-option-custom {
  background: #fafafa;
  border: 1px dashed var(--border) !important;
  padding: 10px 12px;
}
.vote-option-custom input[type="text"]:focus {
  outline: none; border-color: var(--accent) !important;
  background: #fff !important;
}
.vote-card-footer {
  display: flex; justify-content: space-between;
  align-items: center; margin-top: 14px;
  padding-top: 12px; border-top: 1px solid var(--border);
}
.vote-card-btn {
  padding: 6px 16px;
  background: var(--accent); color: #fff;
  border: none; border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 500; cursor: pointer;
  font-family: var(--font); transition: all 0.15s;
}
.vote-card-btn:hover { background: var(--accent-hover); }
.vote-card-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.vote-status {
  font-size: 11px; padding: 2px 8px;
  border-radius: 10px; font-weight: 500; flex-shrink: 0;
}
.vote-status-active { background: #ECFDF5; color: #059669; }
.vote-status-ended { background: #FEF3C7; color: #d97706; }
.vote-participants { font-size: 12px; color: var(--text-muted); }

/* ===== Discussion Items ===== */
.discussion-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 16px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); margin-bottom: 8px;
  transition: all 0.15s;
}
.discussion-item:hover { border-color: #d0d0d0; }

/* ===== Slider Captcha ===== */
.sliderContainer .block { transition: left 0.08s linear; }
.sliderContainer_active .block { transition: left 0.03s linear; }
.sliderContainer .slider { transition: left 0.08s linear, background 0.2s linear; }
.sliderContainer_active .slider { transition: left 0.03s linear; }
.sliderContainer .sliderMask { transition: width 0.08s linear; }
.sliderContainer_active .sliderMask { transition: width 0.03s linear; }
.sliderContainer_fail .block,
.sliderContainer_fail .slider,
.sliderContainer_fail .sliderMask {
  transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
}
.sliderContainer .slider { transition: background 0.2s linear; }
.sliderContainer_active .slider { transition: none; }
.sliderContainer .block { transition: none; }
.sliderContainer_active .block { transition: none; }
.sliderContainer .sliderMask { transition: none; }
.sliderContainer_active .sliderMask { transition: none; }

/* ===== Responsive ===== */
@media (max-width: 640px) {
  .header { padding: 24px 16px 20px; }
  .header h1 { font-size: 19px; }
  .container { padding: 16px 12px 40px; }
  .notice-card { padding: 18px; }
  .notice-card .notice-title { font-size: 15px; }
  .modal-box { width: 100vw; max-height: 100vh; height: 100vh; border-radius: 0; border: none; }
  .modal-header { padding: 14px 16px; }
  .modal-header h3 { font-size: 15px; }
  .modal-body { padding: 16px; }
  .form-actions { padding: 12px 16px; gap: 8px; }
  .form-actions .btn-cancel,
  .form-actions .btn-submit { flex: 1; text-align: center; padding: 10px; font-size: 14px; }
  .action-bar { justify-content: stretch; }
  .action-btn { flex: 1; justify-content: center; }
  .user-bar { flex-direction: column; gap: 8px; align-items: stretch; text-align: center; }
  .user-bar-actions { justify-content: center; }
  .login-box { padding: 28px 20px; }
  .vote-card { padding: 16px; }
}
</style>

          <button type="button" onclick="insertMd('notifContent','*','*')" style="padding:3px 10px;border:1px solid var(--border);border-radius:4px;background:#fff;cursor:pointer;font-size:13px;font-style:italic;" title="斜体">I</button>

          <button type="button" onclick="insertMd('notifContent','\n> ','')" style="padding:3px 10px;border:1px solid var(--border);border-radius:4px;background:#fff;cursor:pointer;font-size:13px;" title="引用">❝</button>
          <button type="button" onclick="insertMd('notifContent','[','](url)')" style="padding:3px 10px;border:1px solid var(--border);border-radius:4px;background:#fff;cursor:pointer;font-size:13px;" title="链接"><svg class="icon" width="1em" height="1em"><use href="#icon-link"/></svg></button>

          <button type="button" onclick="importMdFile('notifContent')" style="padding:6px 14px;border:1px dashed var(--border);border-radius:6px;background:transparent;cursor:pointer;font-size:12px;color:var(--text-sub);transition:all 0.2s;" title="从本地选择 Markdown 文件导入"><svg class="icon" width="1em" height="1em"><use href="#icon-file"/></svg> 从Markdown文件中导入</button>

        <div id="publishImagePreview" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;"></div>
        <div style="margin-top:8px;">
          <button type="button" onclick="document.getElementById('publishImageInput').click()" style="padding:6px 14px;border:1px dashed var(--border);border-radius:6px;background:transparent;cursor:pointer;font-size:12px;color:var(--text-sub);"><svg class="icon" width="1em" height="1em"><use href="#icon-image"/></svg> 添加图片</button>

        </div>
      </div>
      <div class="form-error" id="publishError"></div>
    </div>
    <div class="form-actions">
      <button class="btn-cancel" onclick="closePublishModal()">取消</button>

// ===== Markdown 工具 =====
  function renderMarkdown(text) {
    if (!text) return '';
    var html = text
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      // 删除线 ~~text~~
      .replace(/~~([^~]+)~~/g, '<del>$1</del>')
      // 下划线 __text__（不能包含空格，避免与加粗混淆）
      .replace(/__([^_]+)__/g, '<u>$1</u>')
      // 加粗 **text**
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      // 斜体 *text*
      .replace(/\*([^*]+)\*/g, '<em>$1</em>')
      // 上标 ^text^
      .replace(/\^([^^]+)\^/g, '<sup>$1</sup>')
      // 下标 ~text~
      .replace(/~([^~]+)~/g, '<sub>$1</sub>')
      // 列表项
      .replace(/^[\*\-\+] (.+)$/gm, '<li>$1</li>')
      .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
      // 标题
      .replace(/^### (.+)$/gm, '<h3>$1</h3>')
      .replace(/^## (.+)$/gm, '<h2>$1</h2>')
      .replace(/^# (.+)$/gm, '<h1>$1</h1>')
      // 分隔线
      .replace(/^---+\s*$/gm, '<hr>')
      // 引用
      .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
      // 代码
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      // 表格
      .replace(/^\|(.+)\|$/gm, function(m, content) {
        var cells = content.split('|').map(function(c) { return c.trim(); });
        // 如果是分隔行（|---|），跳过
        if (cells.length > 0 && /^[-:\s]+$/.test(cells[0])) return '';
        return '<tr><td>' + cells.join('</td><td>') + '</td></tr>';
      })
      // 将连续的 <tr> 包裹在 <table> 中
      .replace(/((?:<tr>.*?<\/tr>\s*)+)/g, '<table style="border-collapse:collapse;width:100%;margin:8px 0;"><tbody>$1</tbody></table>')
      // 给 <td> 加边框
      .replace(/<td>/g, '<td style="border:1px solid var(--border);padding:8px 10px;">')
      // 图片和链接
      .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" style="max-width:100%;border-radius:8px;margin:6px 0;">')
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="nofollow">$1</a>')
      // 换行
      .replace(/\n\n/g, '</p><p>')
      .replace(/\n/g, '<br>');
    // Wrap consecutive <li> in <ul>
    html = html.replace(/((?:<li>.*?<\/li>)+)/g, '<ul>$1</ul>');
    // Wrap standalone <blockquote> in proper block
    html = html.replace(/<blockquote>/g, '<blockquote style="margin:10px 0;padding:10px 14px;border-left:3px solid var(--accent);background:rgba(0,0,0,0.02);border-radius:0 6px 6px 0;color:var(--text-sub);">');
    return '<p>' + html + '</p>';
  }

  var _importMdTarget = null;

    _importMdTarget = textareaId;

  };
  window.handleMdFile = function(input) {
    var file = input.files[0];
    if (!file || !_importMdTarget) return;

    // === 安全检查 1：文件大小限制 ===
    if (file.size > 10 * 1024 * 1024) {
      showToast('<svg class="icon" width="1em" height="1em"><use href="#icon-x"/></svg> ' + file.name + ' 超过10MB', 'error');
      return;
    }
    if (file.size === 0) {
      showToast('<svg class="icon" width="1em" height="1em"><use href="#icon-x"/></svg> 文件为空', 'error');
      return;
    }

    // === 安全检查 2：文件类型白名单 ===
    var allowedExts = ['.md', '.markdown', '.txt', '.mdown', '.mkd', '.mkdn'];
    var ext = file.name.substring(file.name.lastIndexOf('.')).toLowerCase();
    if (allowedExts.indexOf(ext) === -1 && ext.indexOf('.') === 0) {
      showToast('<svg class="icon" width="1em" height="1em"><use href="#icon-x"/></svg> 不支持的文件类型：' + ext + '，仅支持 .md / .markdown / .txt', 'error');
      return;
    }

    // === 安全检查 3：仅读取前 2KB 做内容校验 ===
    var safetyBlob = file.slice(0, 2048);
    var safetyReader = new FileReader();
    safetyReader.onload = function(safetyEvent) {
      var head = safetyEvent.target.result;

      // 检查是否为二进制文件（包含大量 null 字节或非文本字符）
      var binaryScore = 0;
      for (var i = 0; i < head.length; i++) {
        var cc = head.charCodeAt(i);
        if (cc === 0 || (cc < 8 && cc > 0)) { binaryScore += 3; }
        else if (cc < 32 && cc !== 9 && cc !== 10 && cc !== 13) { binaryScore += 1; }
      }
      if (binaryScore > 10) {
        showToast('<svg class="icon" width="1em" height="1em"><use href="#icon-x"/></svg> 文件包含非文本内容，请选择纯文本 Markdown 文件', 'error');
        return;
      }

      // === 安全检查 4：检查完整内容中的注入风险 ===
      var fullReader = new FileReader();
      fullReader.onload = function(e) {
        var rawContent = e.target.result;

        // 检查是否包含 HTML 标签（XSS 防护）
        var suspiciousTags = rawContent.match(/<(\/?)(script|iframe|embed|object|applet|meta|link|style|form|input|button|textarea|select|option|on\w+\s*=|javascript:|data:\s*text\/html|vbscript:|expression\s*\(|alert\s*\(|document\.|window\.|eval\s*\(|setTimeout|setInterval|new\s+Function|fetch\s*\(|XMLHttpRequest)/gi);
        if (suspiciousTags && suspiciousTags.length > 0) {
          showToast('<svg class="icon" width="1em" height="1em"><use href="#icon-warning"/></svg> 文件包含可疑内容（' + suspiciousTags.length + ' 处），已自动过滤', 'warning');
        }

        // === 安全处理：剥离注入内容 ===
        var content = rawContent
          // 剥离 script 标签及内容
          .replace(/<script[^>]*>[\s\S]*?<\/script>/gi, '')
          // 剥离 iframe/embed/object
          .replace(/<(iframe|embed|object|applet)[^>]*>[\s\S]*?<\/\1>/gi, '')
          .replace(/<(\/?)iframe[^>]*>/gi, '')
          .replace(/<(\/?)embed[^>]*>/gi, '')
          .replace(/<(\/?)object[^>]*>/gi, '')
          // 剥离事件处理器 onclick= onload= 等
          .replace(/\s+on\w+\s*=\s*(?:"[^"]*"|'[^']*'|[^\s>]+)/gi, '')
          // 剥离 javascript: / data: URI
          .replace(/\s*(?:href|src|action)\s*=\s*(?:"|')\s*(?:javascript|data|vbscript)\s*:/gi, ' $1=')
          // 剥离 style/link/meta 危险标签
          .replace(/<(link|meta|style)[^>]*>/gi, '')
          // 剥离表达注入
          .replace(/(?:expression|eval|alert|prompt)\s*\(/gi, '')
          // 剥离 base64 中嵌入的 HTML
          .replace(/data\s*:\s*text\/html/i, 'data: text/plain');

        // === Markdown 格式校验 ===
        var totalLines = content.split('\n').length;
        var mdLineCount = 0;
        var mdPatterns = [
          /^#{1,6}\s+/m, /^\*{2}[^*]+\*{2}/m, /^\[([^\]]+)\]\(([^)]+)\)/m,
          /^>\s+/m, /^[-*+]\s+/m, /^\d+\.\s+/m, /^`{1,3}/m,
          /^\|.+\|/m, /^!\[([^\]]*)\]\(([^)]+)\)/m, /^---+\s*$/m,
          /\*\*[^*]+\*\*/g, /~~[^~]+~~/g, /__[^_]+__/g
        ];
        for (var pi = 0; pi < mdPatterns.length; pi++) {
          var matches = content.match(mdPatterns[pi]);
          if (matches) mdLineCount += matches.length;
        }

        // 空文件或有大量二进制残留
        if (totalLines > 2 && mdLineCount === 0 && content.replace(/\s/g, '').length > 20) {
          // 可能是纯文本，仍然允许导入，但给出提示
        }

        // === 安全检查 5：最大行数和字符限制 ===
        var MAX_LINES = 500;
        var MAX_CHARS = 50000;
        if (totalLines > MAX_LINES) {
          var lines = content.split('\n');
          content = lines.slice(0, MAX_LINES).join('\n');
          showToast('<svg class="icon" width="1em" height="1em"><use href="#icon-warning"/></svg> 行数超过 ' + MAX_LINES + ' 行，已截断', 'warning');
        }
        if (content.length > MAX_CHARS) {
          content = content.substring(0, MAX_CHARS);
          showToast('<svg class="icon" width="1em" height="1em"><use href="#icon-warning"/></svg> 内容超过 ' + MAX_CHARS + ' 字符，已截断', 'warning');
        }

        // === 正常导入流程 ===
        var ta = document.getElementById(_importMdTarget);
        var start = ta.selectionStart, end = ta.selectionEnd;

        // 从文件名提取标题
        var fileName = file.name.replace(/\.(md|markdown|txt|mdown|mkd|mkdn)$/i, '').replace(/^\d+[\s\.\-_]*/, '');
        // 从内容提取 h1 标题
        var titleMatch = content.match(/^#\s+(.+)$/m);
        var title = titleMatch ? titleMatch[1].trim().substring(0, 100) : fileName.substring(0, 100);

        // 插入内容
        ta.value = ta.value.substring(0, start) + '\n' + content + '\n' + ta.value.substring(end);
        ta.focus();

        // 自动填充标题
        var titleInputId = _importMdTarget === 'notifContent' ? 'notifTitle' : 'editTitle';
        var titleInput = document.getElementById(titleInputId);
        if (titleInput && !titleInput.value.trim()) {
          titleInput.value = title;
        }

        showToast('<svg class="icon" width="1em" height="1em"><use href="#icon-check"/></svg> 已导入 ' + file.name + '（' + totalLines + ' 行）', 'success');
        _importMdTarget = null;
      };
      fullReader.readAsText(file);
    };
    safetyReader.readAsBinaryString ? safetyReader.readAsBinaryString(safetyBlob) : safetyReader.readAsText(safetyBlob);
  };

  // ===== 加载通知列表 =====
  async function loadNotices() {
    try {
      var res = await fetch('/api/notices');

      if (!json.ok) { list.innerHTML = '<div class="empty-tip">\u52A0\u8F7D\u5931\u8D25</div>'; return; }
      var data = json.data || [];
      if (data.length === 0) {
        list.innerHTML = '<div class="empty-tip">\u6682\u65E0\u901A\u77E5</div>';
        return;
      }
      var html = '';
      data.forEach(function(n) {
        var time = n.createdAt ? new Date(n.createdAt).toLocaleString('zh-CN', {
          year: 'numeric', month: 'long', day: 'numeric',
          hour: '2-digit', minute: '2-digit'
        }) : '';
        html += '<div class="notice-card">' +
          '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">' +
          '<div style="flex:1;">' +
          '<div class="notice-title">' + escHtml(n.title) + '</div>' +
          '<div class="notice-content">' + renderMarkdown(n.content) + '</div>' +
          (n.images && n.images.length > 0 ? '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;margin-bottom:4px;">' +
            n.images.map(function(src) {
              return '<img src="' + src + '" style="max-width:100%;max-height:300px;border-radius:8px;border:1px solid var(--border);object-fit:contain;cursor:pointer;" onclick="window.open(this.src)" onerror="this.style.display=\'none\'">';
            }).join('') +
          '</div>' : '') +
          '</div>' +
          (currentUser ? '<div style="display:flex;gap:2px;flex-shrink:0;">' +
            '<button onclick="openEditModal(\'' + n.id + '\')" style="background:none;border:none;cursor:pointer;font-size:14px;color:#9ca3af;padding:2px 5px;line-height:1;border-radius:4px;" title="修改通知" onmouseover="this.style.background=\'#dbeafe\';this.style.color=\'#2563eb\'" onmouseout="this.style.background=\'transparent\';this.style.color=\'#9ca3af\'"><svg class="icon" width="1em" height="1em"><use href="#icon-edit"/></svg></button>' +
            '<button onclick="deleteNotice(\'' + n.id + '\')" style="background:none;border:none;cursor:pointer;font-size:16px;color:#9ca3af;padding:2px 4px;line-height:1;border-radius:4px;" title="删除通知" onmouseover="this.style.background=\'#fee2e2\';this.style.color=\'#dc2626\'" onmouseout="this.style.background=\'transparent\';this.style.color=\'#9ca3af\'">✕</button>' +
            '</div>' : '') +
          '</div>' +
          '<div class="notice-meta">' +
          '<span>' + ICONS.user + ' ' + escHtml(n.author || '\u6821\u56ED\u5899') + '</span>' +
          '<span>' + ICONS.calendar + ' ' + time + '</span>' +
          '</div></div>';
      });
      list.innerHTML = html;
    } catch(e) {
      document.getElementById('noticeList').innerHTML = '<div class="empty-tip">\u7F51\u7EDC\u9519\u8BEF</div>';
    }
  }

  window.openEditNoticeVote = function(voteId) {
    var vote = null;
    if (_votes && _votes.length > 0) {
      for (var i = 0; i < _votes.length; i++) {
        if (_votes[i].id === voteId) { vote = _votes[i]; break; }
      }
    }
    if (!vote) { showToast('未找到投票数据', 'error'); return; }

    window._editingNoticeVoteId = voteId;
    document.getElementById('voteModalTitle').innerHTML = '<svg class="icon" width="1em" height="1em"><use href="#icon-edit"/></svg> 编辑投票';
    document.getElementById('voteSubmitBtn').innerHTML = '<svg class="icon" width="1em" height="1em"><use href="#icon-save"/></svg> 保存修改';
    document.getElementById('voteOverlay').style.display = 'flex';
    document.getElementById('voteError').textContent = '';

    // 填充表单
    document.getElementById('voteTitle').value = vote.title || '';
    document.getElementById('voteMultiple').checked = !!vote.multiple;
    document.getElementById('voteAllowCustom').checked = !!vote.allowCustom;

    if (vote.endTime) {
      try {
        var d = new Date(vote.endTime);
        var pad = function(n) { return n < 10 ? '0' + n : '' + n; };
        document.getElementById('voteEndTime').value =
          d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' +
          pad(d.getHours()) + ':' + pad(d.getMinutes());
      } catch(e) {
        document.getElementById('voteEndTime').value = '';
      }
    } else {
      document.getElementById('voteEndTime').value = '';
    }

    // 重建选项
    var container = document.getElementById('noticeVoteOptions');
    var oldRows = container.querySelectorAll('.notice-vote-opt-row');
    oldRows.forEach(function(r) { r.remove(); });

    var voteOptions = vote.options || [];
    var renderCount = Math.max(2, voteOptions.length);
    for (var i = 0; i < renderCount; i++) {
      var opt = voteOptions[i];
      var row = document.createElement('div');
      row.className = 'notice-vote-opt-row';
      row.style.cssText = 'display:flex;gap:6px;align-items:center;margin-bottom:6px;';
      var hasImg = opt && opt.image;
      var imgHtml = hasImg
        ? ('<span class="notice-vote-img-preview" style="display:block;width:28px;height:28px;border-radius:4px;overflow:hidden;flex-shrink:0;border:1px solid var(--border);"><img src="' + opt.image + '" style="width:100%;height:100%;object-fit:cover;"></span>')
        : '<span class="notice-vote-img-preview" style="display:none;width:28px;height:28px;border-radius:4px;overflow:hidden;flex-shrink:0;border:1px solid var(--border);"><img style="width:100%;height:100%;object-fit:cover;"></span>';
      var btnHtml = i === 0
        ? '<button type="button" class="notice-vote-add" onclick="addNoticeVoteOpt(this)" style="padding:4px 10px;border:1px dashed var(--accent);border-radius:4px;background:var(--bg);color:var(--accent);cursor:pointer;">+</button>'
        : '<button type="button" onclick="removeNoticeVoteOpt(this)" style="padding:4px 10px;border:1px solid #ff6b6b;border-radius:4px;background:var(--bg);color:#ff6b6b;cursor:pointer;">−</button>';
      row.innerHTML =
        '<input type="text" class="notice-vote-opt-input" value="' +
        ((opt && opt.text) || '').replace(/"/g, '&quot;') +
        '" placeholder="选项 ' + (i + 1) + '" style="flex:1;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;">' +
        '<input type="file" accept="image/*" style="display:none;" onchange="handleNoticeVoteImg(this)">' +
        '<button type="button" onclick="this.previousElementSibling.click()" style="padding:4px 8px;border:1px solid var(--border);border-radius:4px;background:var(--bg);cursor:pointer;"><svg class="icon" width="1em" height="1em"><use href="#icon-image"/></svg></button>' +
        imgHtml +
        btnHtml;
      container.appendChild(row);
    }
  };

  window.doUpdateVote = async function() {
    var voteId = window._editingNoticeVoteId;
    if (!voteId) return;

    var title = document.getElementById('voteTitle').value.trim();
    var multiple = document.getElementById('voteMultiple').checked;
    var allowCustom = document.getElementById('voteAllowCustom').checked;
    var endTime = document.getElementById('voteEndTime').value || null;
    var errEl = document.getElementById('voteError');

    if (!title) { errEl.textContent = '请输⼊投票标题'; return; }
    if (title.length > 100) { errEl.textContent = '标题最多100字'; return; }

    var rows = document.querySelectorAll('#noticeVoteOptions .notice-vote-opt-row');
    var options = [];
    var optionImages = [];
    rows.forEach(function(row) {
      var input = row.querySelector('.notice-vote-opt-input');
      var text = input ? input.value.trim() : '';
      if (text) {
        options.push(text);
        var preview = row.querySelector('.notice-vote-img-preview');
        var img = preview ? preview.querySelector('img') : null;
        optionImages.push(img && img.src ? img.src : null);
      }
    });
    if (options.length < 2) { errEl.textContent = '至少需要2个选项'; return; }
    if (options.length > 20) { errEl.textContent = '最多20个选项'; return; }

    errEl.textContent = '';
    var btn = document.getElementById('voteSubmitBtn');
    var originalText = btn.textContent;
    btn.disabled = true; btn.textContent = '\u66F4\u65B0\u4E2D\u2026';

    try {
      var token = localStorage.getItem(SC_TOKEN_KEY);
      var res = await fetch('/api/votes/' + encodeURIComponent(voteId), {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'x-sc-token': token || '' },
        body: JSON.stringify({
          title: title,
          options: options.map(function(t, i) { return { text: t, image: optionImages[i] }; }),
          multiple: multiple,
          allowCustom: allowCustom,
          endTime: endTime ? new Date(endTime).toISOString() : null
        })
      });
      var json = await res.json();
      if (json.ok) {
        window._editingNoticeVoteId = null;
        closeVoteModal();
        loadVoteList();
        showToast('\u6295\u7968\u4FEE\u6539\u6210\u529F', 'success');
      } else {
        errEl.textContent = json.msg || json.warningMsg || '\u4FEE\u6539\u5931\u8D25';
        btn.disabled = false; btn.textContent = originalText;
      }
    } catch (e) {
      errEl.textContent = '\u7F51\u7EDC\u9519\u8BEF';
      btn.disabled = false; btn.textContent = originalText;
    }
  };

  window.handleNoticeVoteImg = function(input) {
    var file = input.files[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) { showToast('请选择图片文件', 'error'); input.value = ''; return; }
    if (file.size > 10 * 1024 * 1024) { showToast('图片不能超过10MB', 'error'); input.value = ''; return; }
    var reader = new FileReader();
    reader.onload = function(e) {
      var row = input.closest('.notice-vote-opt-row');
      var prev = row.querySelector('.notice-vote-img-preview');
      if (prev) { prev.style.display = 'block'; prev.querySelector('img').src = e.target.result; }
    };
    reader.readAsDataURL(file);
  };

    if (!currentUser) {
      showToast('\u8BF7\u5148\u767B\u5F55', 'error');
      return;
    }
    openDiscussionModal();
  };

  window.openDiscussionModal = function() {
    document.getElementById('discussionOverlay').style.display = 'flex';
    document.getElementById('discussionError').textContent = '';
    document.getElementById('discussionTitle').value = '';
    document.getElementById('discussionExpires').value = '';
  };

  window.closeDiscussionModal = function() {
    document.getElementById('discussionOverlay').style.display = 'none';
    document.getElementById('discussionError').textContent = '';
  };

  window.doCreateDiscussion = async function() {
    var title = document.getElementById('discussionTitle').value.trim();
    var expiresAt = document.getElementById('discussionExpires').value || null;
    var errEl = document.getElementById('discussionError');
    if (!title) { errEl.textContent = '\u8BF7\u8F93\u5165\u8BDD\u9898\u6807\u9898'; return; }
    errEl.textContent = '';
    var btn = document.getElementById('discussionBtn');
    btn.disabled = true; btn.textContent = '\u521B\u5EFA\u4E2D\u2026';
    try {
      var token = localStorage.getItem(SC_TOKEN_KEY);
      var res = await fetch('/api/discussions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-sc-token': token || '' },
        body: JSON.stringify({ title: title, expiresAt: expiresAt })
      });
      var json = await res.json();
      if (json.ok) {
        showToast('' + ICONS.check + ' \u8BDD\u9898\u5DF2\u521B\u5EFA', 'success');
        closeDiscussionModal();
        loadDiscussions();
      } else {
        errEl.textContent = json.msg || '\u521B\u5EFA\u5931\u8D25';
      }
    } catch(e) { errEl.textContent = '\u7F51\u7EDC\u9519\u8BEF'; }
    finally { btn.disabled = false; btn.innerHTML = '' + ICONS.message + ' \u53D1\u8D77\u8BDD\u9898'; }
  };

  async function loadDiscussions() {
    try {
      var res = await fetch('/api/discussions');
      var json = await res.json();
      var list = document.getElementById('discussionList');
      if (!json.ok) { list.innerHTML = '<div class="empty-tip">\u52A0\u8F7D\u5931\u8D25</div>'; return; }
      var data = json.data || [];
      if (data.length === 0) {
        list.innerHTML = '<div class="empty-tip">\u6682\u65E0\u8BA8\u8BBA\u8BDD\u9898</div>';
        return;
      }
      var html = '';
      data.forEach(function(d) {
        var expiresText = d.expiresAt ? '\u5230 ' + new Date(d.expiresAt).toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '\u65E0\u671F\u9650';
        var isExpired = d.expiresAt && new Date(d.expiresAt) < new Date();
        html += '<div class="discussion-item" style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--card-bg);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;' + (isExpired ? 'opacity:0.6;' : '') + '">' +
          '<div style="flex:1;">' +
          '<div style="font-weight:600;font-size:14px;color:' + (isExpired ? '#9ca3af' : 'var(--text)') + ';">' + escHtml(d.title) + (isExpired ? ' <span style="font-size:11px;color:var(--text-sub);">(\u5DF2\u8FC7\u671F)</span>' : '') + '</div>' +
          '<div style="font-size:11px;color:var(--text-sub);margin-top:3px;">' + ICONS.calendar + ' ' + expiresText + ' \u00B7 ' + ICONS.message + ' ' + (d.commentCount || 0) + ' \u6761\u8BC4\u8BBA</div>' +
          '</div></div>';
      });
      list.innerHTML = html;
    } catch(e) {
      document.getElementById('discussionList').innerHTML = '<div class="empty-tip">\u7F51\u7EDC\u9519\u8BEF</div>';
    }
  }

  function showToast(msg, type) {
    var t = document.createElement('div');
    t.className = 'toast ' + type;
    t.innerHTML = msg;
    document.body.appendChild(t);
    setTimeout(function() { t.remove(); }, 2500);
  }

  // ===== 敏感词警告弹窗 =====
  function showSensitiveWarning(onEdit, onContinue) {
    var overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;z-index:10001;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.45);backdrop-filter:blur(4px);';
    overlay.innerHTML = '<div style="background:#fffbe6;border:2px solid #f5c518;border-radius:16px;padding:28px 24px;max-width:420px;width:90%;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,0.2);animation:modalIn 0.3s ease;">' +
      '<div style="font-size:40px;margin-bottom:8px;"><svg class="icon" width="1em" height="1em"><use href="#icon-warning"/></svg></div>' +
      '<h3 style="margin:0 0 6px;font-size:17px;color:#5a3d00;">内容包含敏感词</h3>' +
      '<p style="font-size:13px;color:#7a5a2a;line-height:1.6;margin-bottom:20px;">检测到内容中包含敏感词，请修改后重新提交。<br>如果你确认内容合规，也可以选择继续发布。</p>' +
      '<div style="display:flex;gap:10px;justify-content:center;">' +
      '<button onclick="this.closest(\'[style*=\\"position:fixed\\"]\').remove()" style="padding:9px 20px;border:1px solid #e8c84a;border-radius:8px;background:#fff;color:#5a3d00;font-size:14px;cursor:pointer;font-family:inherit;">返回修改</button>' +
      '<button onclick="var o=this.closest(\'[style*=\\"position:fixed\\"]\');o.remove();(' + onContinue.toString() + ')()" style="padding:9px 20px;border:none;border-radius:8px;background:linear-gradient(135deg,#f5c518,#e0a800);color:#5a3d00;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;">继续发布</button>' +
      '</div></div>';
    document.body.appendChild(overlay);
  }

  // ===== 反霸凌警告弹窗（仅返回编辑，不可强制发送）=====
  function showBullyingWarning(onEdit) {
    var overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;z-index:10001;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.45);backdrop-filter:blur(4px);';
    overlay.innerHTML = '<div style="background:#fef2f2;border:2px solid #ef4444;border-radius:16px;padding:28px 24px;max-width:420px;width:90%;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,0.2);animation:modalIn 0.3s ease;">' +
      '<div style="font-size:40px;margin-bottom:8px;"><svg class="icon" width="1em" height="1em"><use href="#icon-shield"/></svg></div>' +
      '<h3 style="margin:0 0 6px;font-size:17px;color:#991b1b;">内容涉及受保护人员</h3>' +
      '<p style="font-size:13px;color:#b91c1c;line-height:1.6;margin-bottom:20px;">检测到内容包含受霸凌保护的人员姓名，<br>此内容已被系统拦截，无法发布。</p>' +
      '<button onclick="this.closest(\'[style*=\\"position:fixed\\"]\').remove()" style="padding:9px 20px;border:none;border-radius:8px;background:#ef4444;color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;">知道了，返回修改</button></div>';
    document.body.appendChild(overlay);
  }

  // ===== #话题自动补全（notifContent / editContent 输入框）=====
  var _suggestTimer = null;
  function setupDiscussionSuggest(textareaId) {
    var ta = document.getElementById(textareaId);
    if (!ta) return;
    ta.addEventListener('input', function() {
      var val = this.value;
      var cursorPos = this.selectionStart;
      var textBefore = val.substring(0, cursorPos);
      var hashIdx = textBefore.lastIndexOf('#');
      if (hashIdx >= 0 && (hashIdx === 0 || /\s/.test(textBefore[hashIdx - 1]))) {
        var query = textBefore.substring(hashIdx + 1);
        if (query.length > 0 && !/\s/.test(query)) {
          if (_suggestTimer) clearTimeout(_suggestTimer);
          _suggestTimer = setTimeout(function() { fetchNotifSuggest(textareaId, query); }, 200);
          return;
        }
      }
      hideNotifSuggest();
    });
    ta.addEventListener('blur', function() { setTimeout(hideNotifSuggest, 300); });
    ta.addEventListener('scroll', repositionNotifSuggest);
  }
  window.addEventListener('resize', function() { if (document.getElementById('notifSuggestBox').style.display !== 'none') repositionNotifSuggest(); });

  function fetchNotifSuggest(textareaId, q) {
    fetch('/api/discussions?q=' + encodeURIComponent(q)).then(function(r) { return r.json(); }).then(function(j) {
      if (!j.ok || !j.data || j.data.length === 0) { hideNotifSuggest(); return; }
      var box = document.getElementById('notifSuggestBox');
      var ta = document.getElementById(textareaId);
      var rect = ta.getBoundingClientRect();
      box.style.top = (rect.top - 10) + 'px';
      box.style.left = rect.left + 'px';
      box.style.width = rect.width + 'px';
      box.innerHTML = j.data.map(function(d) {
        return '<div onclick="selectNotifSuggest(\'' + textareaId + '\',\'' + d.id + '\',\'' + escHtml(d.title.replace(/'/g,"\\'")) + '\')" style="padding:8px 12px;cursor:pointer;border-bottom:1px solid #f0e8a0;transition:background 0.1s;" onmouseover="this.style.background=\'#fef7d0\'" onmouseout="this.style.background=\'\'">' + ICONS.message + ' ' + escHtml(d.title) + '</div>';
      }).join('');
      box.style.display = 'block';
    }).catch(function() { hideNotifSuggest(); });
  }

  function hideNotifSuggest() {
    var box = document.getElementById('notifSuggestBox');
    if (box) box.style.display = 'none';
  }

  function repositionNotifSuggest() {
    var box = document.getElementById('notifSuggestBox');
    if (box.style.display === 'none') return;
    var ta = document.querySelector('textarea:focus');
    if (!ta) return;
    var rect = ta.getBoundingClientRect();
    box.style.top = (rect.top - 10) + 'px';
    box.style.left = rect.left + 'px';
  }

  window.selectNotifSuggest = function(textareaId, id, title) {
    var ta = document.getElementById(textareaId);
    if (!ta) return;
    var val = ta.value;
    var cursorPos = ta.selectionStart;
    var textBefore = val.substring(0, cursorPos);
    var hashIdx = textBefore.lastIndexOf('#');
    if (hashIdx >= 0) {
      var afterHash = textBefore.substring(hashIdx);
      var spaceIdx = afterHash.indexOf(' ');
      var replaceEnd = spaceIdx >= 0 ? hashIdx + spaceIdx : cursorPos;
      ta.value = val.substring(0, hashIdx) + '#' + title + ' ' + val.substring(cursorPos);
      ta.focus();
      var newPos = hashIdx + 1 + title.length + 1;
      ta.selectionStart = ta.selectionEnd = newPos;
    }
    hideNotifSuggest();
  };

  // ===== 投票功能 =====
  var _votes = [];

  async function loadVoteList() {
    var list = document.getElementById('voteList');
    if (!list) return;
    try {
      var res = await fetch('/api/votes');
      var json = await res.json();
      if (!json.ok) { list.innerHTML = '<div class="empty-tip">加载失败</div>'; return; }
      var data = json.data || [];
      _votes = data;
      var _voteUserVotes = {};
      data.forEach(function(v) {
        if (v.userVoted && v.userVoted.length > 0) {
          _voteUserVotes[v.id] = v.userVoted;
        }
      });
      renderVoteList(data);
    } catch(e) {
      list.innerHTML = '<div class="empty-tip">加载失败</div>';
    }
  }

  function renderVoteList(voteList) {
    var list = document.getElementById('voteList');
    if (!list) return;
    if (!voteList || voteList.length === 0) {
      list.innerHTML = '<div class="empty-tip">暂无投票</div>';
      return;
    }
    var html = '';
    voteList.forEach(function(vote) {
      if (!vote.options) vote.options = [];
      var isEnded = vote.endTime && new Date(vote.endTime) < new Date();
      var voteOpts = vote.options || [];
      var totalVotes = vote.totalVotes !== undefined
        ? vote.totalVotes
        : voteOpts.reduce(function(sum, opt) { return sum + (opt.votes || 0); }, 0);

 html += '<div class="vote-card" onclick="location.href=\'vote.html?id=' + vote.id + '\'" style="cursor:pointer;">';
 html += '<div class="vote-card-header">';
 html += '<div>';
 html += '<a href="vote.html?id=' + vote.id + '" onclick="event.stopPropagation();return false;" class="vote-title-link">' + escHtml(vote.title) + '</a>';
      html += '<div class="vote-card-meta">';
      html += '<span><svg class="icon" width="1em" height="1em"><use href="#icon-vote"/></svg> ' + totalVotes + ' 人参与</span>';
      html += '<span>' + escHtml(vote.author || '') + '</span>';
      html += '<span>' + formatVoteDate(vote.createdAt) + '</span>';
      if (vote.endTime) {
        html += '<span>' + formatVoteDate(vote.endTime) + ' 截止</span>';
      }
      html += '</div>';
      html += '</div>';
      html += '<span class="vote-status ' + (isEnded ? 'vote-status-ended' : 'vote-status-active') + '">';
      html += isEnded ? '已结束' : '进行中';
      html += '</span>';
      if (!isEnded) {
        html += '<button class="vote-card-btn" style="background:#fef3c7;color:#92400e;border:1px solid #f59e0b;font-size:11px;padding:3px 8px;" onclick="endVote(\'' + vote.id + '\')"><svg class="icon" width="1em" height="1em"><use href="#icon-stop"/></svg> 截止</button>';
      }
      html += '<button class="vote-card-btn" style="background:#dbeafe;color:#1e40af;border:1px solid #60a5fa;font-size:11px;padding:3px 8px;" onclick="openEditNoticeVote(\'' + vote.id + '\')"><svg class="icon" width="1em" height="1em"><use href="#icon-edit"/></svg> 编辑</button>';
      html += '</div>';

      html += '<div class="vote-card-options">';
      (voteOpts).forEach(function(opt) {
        var percent = totalVotes > 0 ? Math.round((opt.votes / totalVotes) * 100) : 0;
        html += '<div class="vote-option" style="cursor:default;">';
        html += '<span class="vote-option-text">' + (opt.image ? '<img src="' + opt.image + '" style="width:20px;height:20px;border-radius:3px;object-fit:cover;vertical-align:middle;margin-right:4px;">' : '') + escHtml(opt.text) + '</span>';
        html += '<span class="vote-option-percent">' + percent + '% (' + (opt.votes || 0) + '票)</span>';
        html += '</div>';
        html += '<div class="vote-option-bar"><div class="vote-option-bar-fill" style="width:' + percent + '%"></div></div>';
      });
      html += '</div>';
      html += '</div>';
    });
    list.innerHTML = html;
  }

  window.endVote = async function(voteId) {
    if (!confirm('确认截止此投票？截止后用户无法继续投票。')) return;
    var token = localStorage.getItem(SC_TOKEN_KEY);
    try {
      var res = await fetch('/api/votes/' + voteId + '/end', {
        method: 'POST',
        headers: { 'x-sc-token': token || '' }
      });
      var json = await res.json();
      if (json.ok) {
        showToast('<svg class="icon" width="1em" height="1em"><use href="#icon-check"/></svg> 投票已截止', 'success');
        loadVoteList();
      } else {
        showToast('<svg class="icon" width="1em" height="1em"><use href="#icon-x"/></svg> ' + (json.msg || '操作失败'), 'error');
      }
    } catch(e) {
      showToast('<svg class="icon" width="1em" height="1em"><use href="#icon-x"/></svg> 网络错误', 'error');
    }
  };

  // ===== 工具函数 =====

  function formatVoteDate(isoStr) {
    if (!isoStr) return '';
    var d = new Date(isoStr);
    return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' +
      d.getHours().toString().padStart(2, '0') + ':' +
      d.getMinutes().toString().padStart(2, '0');
  }

  // 为两个内容输入框启用 #话题自动补全
  setupDiscussionSuggest('notifContent');
  setupDiscussionSuggest('editContent');

  // ===== 启动 =====
  var savedToken = localStorage.getItem(SC_TOKEN_KEY);
  var savedName = localStorage.getItem('sc_name');
  if (savedToken) {
    fetch('/api/student-council/me', { headers: { 'x-sc-token': savedToken } })
      .then(function(r) { return r.json(); })
      .then(function(json) {
        if (json.ok) {
          currentUser = { token: savedToken, name: json.data.name };
          document.getElementById('mainApp').classList.add('show');
          document.getElementById('userName').textContent = json.data.name;
          loadNotices();
          loadDiscussions();
          loadVoteList();
        } else {
          localStorage.removeItem(SC_TOKEN_KEY);
          localStorage.removeItem('sc_name');
          checkInit();
        }
      })
      .catch(function() {
        checkInit();
      });
  } else {
    checkInit();
  }
})();
</script>
